[workspace]
resolver = "3"
members = ["crates/core", "crates/settings", "crates/server", "crates/modules/time", "crates/modules/finance", "crates/helpers/activity-snapshot"]
# Module crates (crates/modules/*) are added here, one line each.

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
vitarchy-core = { path = "crates/core" }
vitarchy-settings = { path = "crates/settings" }
vitarchy-time = { path = "crates/modules/time" }
vitarchy-finance = { path = "crates/modules/finance" }

axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "request-id", "propagate-header", "fs"] }
dotenvy = "0.15"
tower = "0.5"
http-body-util = "0.1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
sha2 = "0.10"
strsim = "0.11"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Keep target/ small: 50+ integration-test binaries each link tokio/axum/sqlx/utoipa, and full
# debuginfo made every one of them hundreds of MB. Line tables keep usable backtraces for our
# code; dependencies carry no debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
