[workspace]
resolver = "3"
members = ["crates/core", "crates/settings", "crates/server"]
# Module crates (crates/modules/*) are added here, one line each.

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
vitarchy-core = { path = "crates/core" }
vitarchy-settings = { path = "crates/settings" }

axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "request-id", "propagate-header"] }
dotenvy = "0.15"
tower = "0.5"
http-body-util = "0.1"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
