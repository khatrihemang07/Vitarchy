[package]
name = "activity-snapshot"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# A standalone binary that runs under launchd, outside the server. It depends on
# no workspace crate (see CODING_STANDARDS.md, "Where code lives").
[dependencies]
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
