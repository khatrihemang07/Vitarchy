[project]
name = "statement-reader"
version = "0.1.0"
description = "Reads bank, card and payment-app exports into Transactions (JSON contract v1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf==1.26.4",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "msoffcrypto-tool==5.4.2",
    "olefile==0.47",
]

[project.scripts]
statement-reader = "statement_reader.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
    "xlwt==1.3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statement_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:builtin type .*:DeprecationWarning"]

[tool.ruff]
line-length = 110
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test tables read better on one line
